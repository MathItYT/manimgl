<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ManimGL + Pyodide + WebGPU</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #status { padding: 10px 14px; font-family: monospace; white-space: pre-wrap; }
    #manim-canvas { flex: 1; width: 100%; min-height: 0; display: block; outline: none; }
  </style>
</head>
<body>
  <div id="status">Loading Pyodide…</div>
  <canvas id="manim-canvas" tabindex="0"></canvas>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const pyodideUrl = params.get("pyodide") || "https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.mjs";
    const wgpuWheel = params.get("wgpu") || "./dist/wgpu.whl";
    const manimWheel = params.get("manim") || "./dist/manimgl.whl";
    const status = document.getElementById("status");
    const setStatus = (s) => status.textContent = s;
    try {
      setStatus("Loading Pyodide…");
      const { loadPyodide } = await import(pyodideUrl);
      const pyodide = await loadPyodide();
      setStatus("Installing Python/WebGPU dependencies…");
      await pyodide.loadPackage([
        "numpy", "scipy", "pillow", "sympy", "matplotlib",
        "pygments", "pyyaml", "tqdm", "fonttools"
      ]);
      await pyodide.runPythonAsync(`
import micropip
await micropip.install("${wgpuWheel}")
await micropip.install("${manimWheel}")
`);
      setStatus("Starting Manim scene…");
      await pyodide.runPythonAsync(`
from manimlib import *

class BrowserScene(Scene):
    def construct(self):
        title = Text("ManimGL + WebGPU")
        circle = Circle(radius=1.5)
        circle.set_color(BLUE)
        self.add(title, circle)
        self.update_frame(force_draw=True)
        circle.shift(RIGHT * 2)
        self.update_frame(force_draw=True)

await run_scene_from_class(BrowserScene, "manim-canvas")
`);
      setStatus("Scene ready — the canvas is owned by Manim.");
      document.getElementById("manim-canvas").focus();
    } catch (error) {
      console.error(error);
      setStatus("Failed to start Manim:\n" + error);
    }
  </script>
</body>
</html>
