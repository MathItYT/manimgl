<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ManimGL + Pyodide + WebGPU</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; color: #ddd; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #status { padding: 10px 14px; font-family: monospace; white-space: pre-wrap; }
    #canvas-container {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #manim-canvas {
      display: block;
      width: min(100%, calc((100vh - 42px) * 16 / 9));
      height: auto;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="status">Loading Pyodide…</div>
  <div id="canvas-container">
    <canvas id="manim-canvas" width="1920" height="1080" tabindex="0"></canvas>
  </div>
  <script type="module">
    import { initializeBrowserWasm } from "./browser_wasm/browser_wasm.js";

    const params = new URLSearchParams(location.search);
    const pyodideUrl = params.get("pyodide") || "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.mjs";
    const wheelManifestUrl = new URL(
      params.get("wheels") || "./browser_wasm/dist/wheels/wheels.json",
      document.baseURI,
    ).href;
    const status = document.getElementById("status");
    const setStatus = (s) => status.textContent = s;

    try {
      setStatus("Loading browser WASM backends…");
      await initializeBrowserWasm();

      const pango = await import("./browser_wasm/dist/pango_text_loader.js");
      if (typeof pango.initializePangoText !== "function") {
        throw new Error("PangoCairo loader does not export initializePangoText()");
      }
      await pango.initializePangoText();
      if (typeof window.manimPangoTextToSvg !== "function") {
        throw new Error("PangoCairo WASM initialized, but window.manimPangoTextToSvg was not installed");
      }

      // Download a real TTF and register it in the WASM Fontconfig instance.
      // PangoCairo renders from Fontconfig, so the raw font bytes must be
      // registered with Pango; CSS FontFace alone is not sufficient.
      setStatus("Loading browser font…");
      const fontUrl = "https://raw.githubusercontent.com/openmaptiles/fonts/refs/heads/master/roboto/Roboto-Regular.ttf";
      const fontResponse = await fetch(fontUrl);
      if (!fontResponse.ok) {
        throw new Error("Failed to load browser font: " + fontResponse.status);
      }
      const fontBytes = await fontResponse.arrayBuffer();

      const registeredFont = await window.manimRegisterPangoFont(
        fontBytes,
        "Roboto-Regular.ttf",
      );
      window.manimBrowserFontFamily = String(registeredFont.family);
      setStatus("Browser font registered: " + window.manimBrowserFontFamily);

      setStatus("Loading Pyodide…");
      const { loadPyodide } = await import(pyodideUrl);
      const pyodide = await loadPyodide();

      setStatus("Installing Python/WebGPU dependencies…");
      await pyodide.loadPackage(["micropip", "numpy", "scipy", "pillow", "sympy", "matplotlib", "pygments", "pyyaml", "tqdm", "fonttools"]);

      const wheelManifest = await fetch(wheelManifestUrl).then((response) => {
        if (!response.ok) {
          throw new Error("Failed to load wheel manifest: " + response.status);
        }
        return response.json();
      });

      const wheelBase = new URL(".", wheelManifestUrl).href;
      const wgpuWheel = new URL(wheelManifest.wgpu, wheelBase).href;
      const manimWheel = new URL(wheelManifest.manimgl, wheelBase).href;

      await pyodide.runPythonAsync(`
import micropip
await micropip.install("${wgpuWheel}")
await micropip.install("${manimWheel}")
`);

      setStatus("Starting Manim scene…");
      await pyodide.runPythonAsync(`
from manimlib import *
from js import window

class BrowserScene(Scene):
    async def construct(self):
        # The font was registered from JavaScript before Python started.
        title = Text.create(
            "ManimGL + Pyodide = Love",
            font=str(window.manimBrowserFontFamily),
        )
        title.scale(1.5)

        await self.play_async(Write(title), run_time=1.5)

        circle = Circle(radius=1.5)
        circle.set_color(BLUE)
        self.add(circle)

        await self.play_async(ShowCreation(circle), run_time=1.5)
        await self.play_async(circle.animate.shift(RIGHT * 2), run_time=1.5)

        # Typst is also asynchronous in Pyodide.
        formula = await Typst.create("x^2 + y^2 = r^2")
        formula.scale(1.5)
        formula.next_to(circle, DOWN)
        await self.play_async(GrowFromCenter(formula), run_time=1.5)

await run_scene_from_class(BrowserScene, "manim-canvas")
`);
      setStatus("Scene ready — the canvas is owned by Manim.");
      document.getElementById("manim-canvas").focus();
    } catch (error) {
      console.error(error);
      setStatus("Failed to start Manim:\n" + error);
    }
  </script>
</body>
</html>
