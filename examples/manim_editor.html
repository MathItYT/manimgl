<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManimGL — Monaco Web Editor</title>
  <script src="./coi-serviceworker.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b0e14; --panel:#111620; --line:#252c38; --text:#e5e7eb; --muted:#8e9aae; --accent:#477dff; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
    body { display:flex; flex-direction:column; }
    #toolbar { height:48px; min-height:48px; display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
    button { border:0; border-radius:6px; padding:7px 13px; background:#2b3342; color:#fff; font-weight:600; cursor:pointer; }
    button.primary { background:var(--accent); }
    button:disabled { opacity:.45; cursor:default; }
    #status { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); font:12px monospace; }
    #main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(380px, 46%) 1fr; }
    #editor-wrap { min-width:0; min-height:0; border-right:1px solid var(--line); position:relative; }
    #editor { position:absolute; inset:0; }
    #preview-wrap { min-width:0; min-height:0; display:flex; flex-direction:column; }
    #preview { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:16px; }
    #manim-canvas { display:block; object-fit:contain; outline:none; background:#000; }
    #web-code { max-height:28%; overflow:auto; margin:0 12px 12px; padding:10px; border:1px solid var(--line); border-radius:7px; background:#0e121a; color:#aeb9ca; font:11px/1.45 ui-monospace,monospace; white-space:pre-wrap; }
    #errors { max-height:25%; overflow:auto; margin:0 12px 12px; padding:10px; border:1px solid #512b36; border-radius:7px; background:#1b1015; color:#ff9cac; font:12px/1.45 ui-monospace,monospace; white-space:pre-wrap; display:none; }
    #loading { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(4,6,10,.82); }
    #loading-box { padding:18px 24px; border:1px solid #30394a; border-radius:9px; background:#151b27; font:13px monospace; }
    .label { color:#667287; font:11px monospace; margin:0 12px 5px; }
    #assets-panel {
      position:absolute;
      z-index:8;
      top:8px;
      left:8px;
      bottom:8px;
      width:270px;
      display:none;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(17,22,32,.98);
      box-shadow:0 12px 32px rgba(0,0,0,.35);
      overflow:hidden;
    }
    #assets-panel.open { display:flex; }
    #assets-header {
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px;
      border-bottom:1px solid var(--line);
    }
    #assets-title { flex:1; font-size:12px; font-weight:700; }
    #assets-list {
      flex:1;
      min-height:0;
      overflow:auto;
      padding:7px;
    }
    .asset-empty {
      padding:20px 10px;
      text-align:center;
      color:var(--muted);
      font:12px/1.5 ui-monospace,monospace;
    }
    .asset-item {
      display:grid;
      grid-template-columns:48px 1fr auto;
      gap:8px;
      align-items:center;
      padding:6px;
      border-radius:6px;
      cursor:pointer;
    }
    .asset-item:hover { background:#1b2230; }
    .asset-preview {
      width:48px;
      height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:4px;
      background:#0b0e14;
      color:var(--muted);
      font-size:18px;
    }
    .asset-preview img,
    .asset-preview video {
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .asset-name {
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font:11px ui-monospace,monospace;
    }
    .asset-type {
      margin-top:3px;
      color:var(--muted);
      font:10px ui-monospace,monospace;
    }
    .asset-actions {
      display:flex;
      gap:4px;
    }
    .asset-actions button {
      padding:4px 6px;
      font-size:10px;
    }
    #asset-input { display:none; }
    #fonts-panel {
      position:absolute;
      z-index:9;
      top:8px;
      right:8px;
      bottom:8px;
      width:min(390px, calc(100% - 16px));
      display:none;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(17,22,32,.99);
      box-shadow:0 12px 32px rgba(0,0,0,.4);
      overflow:hidden;
    }
    #fonts-panel.open { display:flex; }
    #fonts-header {
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px;
      border-bottom:1px solid var(--line);
    }
    #fonts-title { flex:1; font-size:13px; font-weight:700; }
    #fonts-summary { padding:8px 10px 0; color:var(--muted); font:11px/1.4 ui-monospace,monospace; }
    #fonts-search { margin:8px; padding:8px; border:1px solid var(--line); border-radius:5px; background:#0b0e14; color:var(--text); }
    #fonts-list { flex:1; min-height:0; overflow:auto; padding:4px 8px; }
    .catalog-font { display:flex; align-items:center; gap:8px; padding:7px 5px; border-radius:5px; font:11px ui-monospace,monospace; }
    .catalog-font:hover { background:#1b2230; }
    .catalog-font input { accent-color:var(--accent); }
    .catalog-font span { flex:1; min-width:0; overflow-wrap:anywhere; }
    .catalog-font small { color:var(--muted); }
    #fonts-actions { display:flex; flex-wrap:wrap; gap:6px; padding:9px; border-top:1px solid var(--line); }
    #fonts-actions button { flex:1; min-width:105px; }
    #fonts-panel.drop-active {
      border:2px dashed var(--accent);
      background:rgba(71,125,255,.10);
    }
    #assets-panel.drop-active {
      border:2px dashed var(--accent);
      background:rgba(71,125,255,.10);
    }
    #assets-drop-overlay {
      position:absolute;
      inset:0;
      z-index:2;
      display:none;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      background:rgba(71,125,255,.10);
      border:2px dashed var(--accent);
      color:#fff;
      font:600 13px ui-monospace,monospace;
    }
    #assets-panel.drop-active #assets-drop-overlay { display:flex; }
    #editor-wrap { overflow:hidden; }

    @media (max-width: 900px) {
      html, body { overflow:hidden; }

      #toolbar {
        height:auto;
        min-height:48px;
        flex-wrap:wrap;
        gap:7px;
        padding:7px;
      }

      #status {
        flex-basis:100%;
        order:3;
      }

      #main {
        display:flex;
        flex-direction:column;
        overflow:hidden;
      }

      #editor-wrap {
        width:100%;
        height:55%;
        min-height:280px;
        flex:none;
        border-right:0;
        border-bottom:1px solid var(--line);
      }

      #preview-wrap {
        width:100%;
        min-height:0;
        flex:1;
      }

      #preview {
        padding:10px;
      }

      #web-code { max-height:24%; }
      #errors { max-height:24%; }

      #assets-panel {
        width:min(320px, calc(100% - 16px));
      }
    }

    @media (max-width: 600px) {
      #toolbar button {
        padding:7px 9px;
        font-size:12px;
      }

      #editor-wrap {
        height:50%;
        min-height:240px;
      }

      #preview { padding:6px; }

      #web-code,
      #errors {
        margin-left:6px;
        margin-right:6px;
        margin-bottom:6px;
      }

      #assets-panel {
        top:6px;
        left:6px;
        bottom:6px;
        width:calc(100% - 12px);
      }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="run" class="primary" disabled>▶ Ejecutar</button>
    <button id="stop" disabled>■ Detener</button>
    <button id="format">Transformar a web</button>
    <button id="assets-toggle">Assets</button>
    <button id="fonts-toggle">Fuentes</button>
    <div id="status">Inicializando Pyodide…</div>
  </div>
  <div id="main">

    <section id="editor-wrap">
      <div id="editor"></div>
      <div id="fonts-panel" aria-label="Catálogo de fuentes">
        <div id="fonts-header">
          <div id="fonts-title">Fuentes</div>
          <button id="fonts-close" title="Cerrar">×</button>
        </div>
        <div id="fonts-summary">Cargando el catálogo…</div>
        <input id="fonts-search" type="search" placeholder="Buscar fuente…" aria-label="Buscar fuente">
        <div id="fonts-list"></div>
        <div id="fonts-actions">
          <button id="fonts-load-selected" class="primary">Cargar seleccionadas</button>
          <button id="fonts-load-all">Cargar todo el catálogo</button>
        </div>
      </div>
      <div id="assets-panel">
        <div id="assets-header">
          <div id="assets-title">Assets</div>
          <button id="asset-upload">＋ Importar</button>
          <button id="asset-refresh" title="Actualizar">↻</button>
          <button id="asset-close" title="Cerrar">×</button>
        </div>
        <div id="assets-list"></div>
      </div>
      <input id="asset-input" type="file" multiple
        accept="image/*,video/*,audio/*,.svg,.json,.txt,.csv,.ttf,.otf,.woff,.woff2">
    </section>
    <section id="preview-wrap">
      <div id="preview"><canvas id="manim-canvas"></canvas></div>
      <div class="label">Código web generado</div>
      <pre id="web-code"></pre>
      <pre id="errors"></pre>
    </section>
  </div>
  <div id="loading"><div id="loading-box">Cargando…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
  <script type="module">
    import { initializeBrowserWasm } from "./browser_wasm/browser_wasm.js";

    const canvas = document.getElementById("manim-canvas");

    function resizeManimCanvas() {
      const preview = document.getElementById("preview");
      if (!preview) return;

      const rect = preview.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      const aspect = 16 / 9;

      let canvasWidth = width;
      let canvasHeight = Math.floor(canvasWidth / aspect);

      if (canvasHeight > height) {
        canvasHeight = height;
        canvasWidth = Math.floor(canvasHeight * aspect);
      }

      canvas.width = Math.max(1, canvasWidth);
      canvas.height = Math.max(1, canvasHeight);
    }

    canvas.width = 1005;
    canvas.height = 1005 * 9 / 16;

    const canvasResizeObserver =
      new ResizeObserver(resizeManimCanvas);
    canvasResizeObserver.observe(
      document.getElementById("preview"),
    );
    const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.mjs";
    const WHEEL_MANIFEST = "./browser_wasm/dist/wheels/wheels.json";

    const DEFAULT_SOURCE = `from manimlib import *

class Demo(Scene):
    def construct(self):
        title = Text("Hola desde ManimGL")
        subtitle = Tex(r"f(x) = x^2 + 1")

        title.to_edge(UP)
        subtitle.next_to(title, DOWN)

        self.add(title, subtitle)
        self.play(
            FadeIn(title),
            FadeIn(subtitle),
        )
        self.wait(1)

        plane = NumberPlane()
        self.play(ShowCreation(plane))
        self.wait(1)
`;
    const CODE_STORAGE_KEY = "manimgl-editor:last-code:v1";
    const ASSET_DB_NAME = "manimgl-editor-assets";
    const ASSET_DB_VERSION = 1;
    const ASSET_STORE_NAME = "assets";

    function getSavedSource() {
      try {
        const saved = localStorage.getItem(CODE_STORAGE_KEY);
        return saved && saved.trim() ? saved : DEFAULT_SOURCE;
      } catch (error) {
        console.warn("[editor persistence] No se pudo leer el código guardado:", error);
        return DEFAULT_SOURCE;
      }
    }

    function saveSource(source) {
      try {
        localStorage.setItem(CODE_STORAGE_KEY, source);
      } catch (error) {
        console.warn("[editor persistence] No se pudo guardar el código:", error);
      }
    }

    function openAssetDatabase() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB no está disponible en este navegador."));
          return;
        }
        const request = indexedDB.open(ASSET_DB_NAME, ASSET_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(ASSET_STORE_NAME)) {
            db.createObjectStore(ASSET_STORE_NAME, { keyPath: "name" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("No se pudo abrir IndexedDB."));
      });
    }

    function assetDbRequest(mode, action) {
      return openAssetDatabase().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(ASSET_STORE_NAME, mode);
        const store = tx.objectStore(ASSET_STORE_NAME);
        let request;
        try {
          request = action(store);
        } catch (error) {
          db.close();
          reject(error);
          return;
        }
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Error en IndexedDB."));
        tx.oncomplete = () => db.close();
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error("Error guardando assets."));
        };
      }));
    }

    function persistAsset(name, bytes) {
      const copy = bytes instanceof Uint8Array ? bytes.slice().buffer : bytes;
      return assetDbRequest("readwrite", store =>
        store.put({ name, bytes: copy, updatedAt: Date.now() })
      );
    }

    function loadPersistedAssets() {
      return assetDbRequest("readonly", store => store.getAll());
    }

    function deletePersistedAsset(name) {
      return assetDbRequest("readwrite", store => store.delete(name));
    }

    let editor;
    let pyodide = null;
    let running = false;
    let runToken = 0;

    const status = document.getElementById("status");
    const loading = document.getElementById("loading");
    const loadingBox = document.getElementById("loading-box");
    const webCode = document.getElementById("web-code");
    const errors = document.getElementById("errors");
    const runButton = document.getElementById("run");
    const stopButton = document.getElementById("stop");
    const assetsPanel = document.getElementById("assets-panel");
    const assetsList = document.getElementById("assets-list");
    const assetInput = document.getElementById("asset-input");
    const assetObjectUrls = new Map();
    const assetFontMetadata = new Map();
    const assetsDropZone = assetsPanel;

    function setStatus(value) { status.textContent = String(value); }
    function setLoading(value, message) {
      loading.style.display = value ? "flex" : "none";
      if (message) loadingBox.textContent = message;
    }
    function showError(error) {
      errors.style.display = "block";
      errors.textContent = String(error?.stack || error);
    }

    const ASSET_DIR = "/assets";

    function ensureAssetDir() {
      if (!pyodide.FS.analyzePath(ASSET_DIR).exists) {
        pyodide.FS.mkdir(ASSET_DIR);
      }
    }

    function assetMimeType(name) {
      const ext = name.toLowerCase().split(".").pop();
      const types = {
        png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif",
        webp:"image/webp", avif:"image/avif", svg:"image/svg+xml",
        mp4:"video/mp4", webm:"video/webm", mov:"video/quicktime",
        ogv:"video/ogg", mp3:"audio/mpeg", wav:"audio/wav", ogg:"audio/ogg",
        m4a:"audio/mp4", json:"application/json", txt:"text/plain",
        csv:"text/csv", ttf:"font/ttf", otf:"font/otf", woff:"font/woff",
        woff2:"font/woff2",
      };
      return types[ext] || "application/octet-stream";
    }

    function assetUrl(path) {
      const oldUrl = assetObjectUrls.get(path);
      if (oldUrl) URL.revokeObjectURL(oldUrl);
      const bytes = pyodide.FS.readFile(path);
      const url = URL.createObjectURL(new Blob([bytes], {type: assetMimeType(path)}));
      assetObjectUrls.set(path, url);
      return url;
    }

    function insertAssetPath(path) {
      const value = JSON.stringify(path);
      const model = editor.getModel();
      const selection = editor.getSelection();
      editor.executeEdits("assets", [{
        range: selection,
        text: value,
        forceMoveMarkers: true,
      }]);
      editor.focus();
    }

    function removeAssetObjectUrl(path) {
      const url = assetObjectUrls.get(path);
      if (url) {
        URL.revokeObjectURL(url);
        assetObjectUrls.delete(path);
      }
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 ** 2) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 ** 2).toFixed(1) + " MB";
    }

    function isFontAsset(name) {
      const extension = name.toLowerCase().split(".").pop();
      return ["ttf", "otf", "woff", "woff2"].includes(extension);
    }

    async function registerFontAsset(path) {
      const result = await pyodide.runPythonAsync(
        "from manimlib.utils.browser_fonts import register_browser_font_path\n"
        + "register_browser_font_path(" + JSON.stringify(path) + ")"
      );
      return result;
    }

    async function readFontMetadata(path) {
      const result = await pyodide.runPythonAsync(
        "from manimlib.utils.browser_fonts import describe_browser_font_path\n"
        + "describe_browser_font_path(" + JSON.stringify(path) + ")"
      );
      return JSON.parse(String(result));
    }

    function createAssetPreview(name, path) {
      const preview = document.createElement("div");
      preview.className = "asset-preview";
      const mime = assetMimeType(name);

      if (mime.startsWith("image/")) {
        const image = document.createElement("img");
        image.src = assetUrl(path);
        image.alt = "";
        preview.appendChild(image);
      } else if (mime.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = assetUrl(path);
        video.muted = true;
        video.preload = "metadata";
        preview.appendChild(video);
      } else if (mime.startsWith("audio/")) {
        preview.textContent = "♫";
      } else if (mime === "image/svg+xml") {
        const image = document.createElement("img");
        image.src = assetUrl(path);
        image.alt = "";
        preview.appendChild(image);
      } else {
        preview.textContent = "▣";
      }
      return preview;
    }

    function refreshAssets() {
      if (!pyodide) return;
      ensureAssetDir();

      for (const path of assetObjectUrls.keys()) {
        if (!pyodide.FS.analyzePath(path).exists) removeAssetObjectUrl(path);
      }

      const names = pyodide.FS.readdir(ASSET_DIR)
        .filter(name => name !== "." && name !== "..")
        .sort((a, b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"}));

      assetsList.replaceChildren();

      if (!names.length) {
        const empty = document.createElement("div");
        empty.className = "asset-empty";
        empty.textContent = "No hay assets. Importa imágenes, videos, audio u otros archivos.";
        assetsList.appendChild(empty);
        return;
      }

      for (const name of names) {
        const path = ASSET_DIR + "/" + name;
        const stat = pyodide.FS.stat(path);
        if (stat.mode && pyodide.FS.isDir(stat.mode)) continue;

        const item = document.createElement("div");
        item.className = "asset-item";
        item.title = path;

        item.appendChild(createAssetPreview(name, path));

        const info = document.createElement("div");
        info.innerHTML = "";
        const nameNode = document.createElement("div");
        nameNode.className = "asset-name";
        nameNode.textContent = name;
        const typeNode = document.createElement("div");
        typeNode.className = "asset-type";
        if (isFontAsset(name)) {
          const metadata = assetFontMetadata.get(path);
          if (metadata) {
            typeNode.textContent =
              metadata.family + " · " +
              metadata.style + " · " +
              metadata.weight + " · " +
              formatBytes(stat.size);
          } else {
            typeNode.textContent = "Fuente · " + formatBytes(stat.size);
          }
        } else {
          typeNode.textContent = formatBytes(stat.size);
        }
        info.append(nameNode, typeNode);

        const actions = document.createElement("div");
        actions.className = "asset-actions";
        const insertButton = document.createElement("button");
        insertButton.textContent = "Insertar";
        insertButton.addEventListener("click", event => {
          event.stopPropagation();
          insertAssetPath(path);
        });
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "×";
        deleteButton.title = "Eliminar asset";
        deleteButton.addEventListener("click", event => {
          event.stopPropagation();
          pyodide.FS.unlink(path);
          removeAssetObjectUrl(path);
          assetFontMetadata.delete(path);
          deletePersistedAsset(name).catch(error =>
            console.warn("[asset persistence] No se pudo eliminar el asset guardado:", name, error)
          );
          refreshAssets();
        });
        actions.append(insertButton, deleteButton);

        item.append(info, actions);
        item.addEventListener("dblclick", () => insertAssetPath(path));
        assetsList.appendChild(item);
      }
    }

    function uniqueAssetPath(fileName) {
      const safeName = fileName.replace(/[/\\]/g, "_").trim() || "asset";
      const dot = safeName.lastIndexOf(".");
      const stem = dot > 0 ? safeName.slice(0, dot) : safeName;
      const ext = dot > 0 ? safeName.slice(dot) : "";
      let candidate = ASSET_DIR + "/" + safeName;
      let index = 1;
      while (pyodide.FS.analyzePath(candidate).exists) {
        candidate = ASSET_DIR + "/" + stem + "_" + index++ + ext;
      }
      return candidate;
    }

    async function importAssets(files) {
      if (!pyodide || !files?.length) return;
      ensureAssetDir();

      let imported = 0;
      for (const file of Array.from(files)) {
        if (!file || typeof file.arrayBuffer !== "function") continue;
        const bytes = new Uint8Array(await file.arrayBuffer());
        const path = uniqueAssetPath(file.name);
        const storedName = path.slice(ASSET_DIR.length + 1);
        pyodide.FS.writeFile(path, bytes);
        try {
          await persistAsset(storedName, bytes);
        } catch (error) {
          console.warn("[asset persistence] No se pudo guardar el asset:", storedName, error);
          setStatus("Asset importado, pero no se pudo guardar de forma persistente: " + storedName);
        }

        const extension = file.name.toLowerCase().split(".").pop();
        if (["ttf", "otf", "woff", "woff2"].includes(extension)) {
          const metadata = await readFontMetadata(path);
          await registerFontAsset(path);
          assetFontMetadata.set(path, metadata);
        }

        imported++;
      }

      refreshAssets();
      if (imported) {
        setStatus(imported === 1
          ? "Asset importado."
          : imported + " assets importados.");
      }
    }

    async function importClipboardData(clipboardData) {
      if (!clipboardData) return;

      const files = Array.from(clipboardData.files || []);
      if (files.length) {
        await importAssets(files);
        return true;
      }

      const items = Array.from(clipboardData.items || []);
      const imageItems = items.filter(item =>
        item.kind === "file" && item.type.startsWith("image/")
      );

      if (!imageItems.length) return false;

      const filesFromClipboard = [];
      for (const item of imageItems) {
        const blob = item.getAsFile();
        if (!blob) continue;
        const extension = blob.type.split("/")[1]?.replace("jpeg", "jpg") || "png";
        filesFromClipboard.push(
          new File([blob], "pasted-image." + extension, {type: blob.type})
        );
      }

      await importAssets(filesFromClipboard);
      return filesFromClipboard.length > 0;
    }

    function clearError() {
      errors.style.display = "none";
      errors.textContent = "";
    }

    function loadMonaco() {
      return new Promise((resolve, reject) => {
        require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs" } });
        require(["vs/editor/editor.main"], () => resolve(), reject);
      });
    }

    async function transformSource(source) {
      const result = await pyodide.runPythonAsync(
        "from manimlib.utils.browser_code_transform import transform_browser_source\n"
        + "transform_browser_source(" + JSON.stringify(source) + ")"
      );
      return String(result);
    }

    function buildRunner(transformed, token, canvasWidth, canvasHeight) {
      return `
import sys
import traceback
from manimlib import *
from manimlib.config import manim_config

# Inter is the default text family in the browser editor.
manim_config.text.font = "Inter"

async def _browser_add_number_line_numbers(line):
    await line.add_numbers_async(excluding=line.numbers_to_exclude)
    return line

if globals().get("_editor_scene") is not None:
    try:
        globals()["_editor_scene"].tear_down()
    except Exception:
        pass
    globals()["_editor_scene"] = None

_exec_before = {
    id(value)
    for value in globals().values()
    if isinstance(value, type)
    and issubclass(value, Scene)
    and value is not Scene
}

exec(${JSON.stringify(transformed)}, globals(), globals())

_candidates = [
    value
    for value in globals().values()
    if isinstance(value, type)
    and issubclass(value, Scene)
    and value is not Scene
    and id(value) not in _exec_before
]

if not _candidates:
    raise RuntimeError("El código no define una clase que herede de Scene.")

_scene_class = _candidates[-1]

_editor_scene = await run_scene_from_class(_scene_class, "manim-canvas", size=(${canvasWidth}, ${canvasHeight}))
_editor_scene_token = ${token}`;
    }

    async function runScene() {
      if (!pyodide || running) return;
      running = true;
      const token = ++runToken;
      runButton.disabled = true;
      stopButton.disabled = false;
      clearError();

      try {
        resizeManimCanvas();
        setStatus("Transformando código nativo → web…");
        const source = editor.getValue();
        const transformed = await transformSource(source);
        webCode.textContent = transformed;

        setStatus("Construyendo escena…");
        await pyodide.runPythonAsync(
          buildRunner(transformed, token, canvas.width, canvas.height)
        );
        setStatus("Escena terminada.");
      } catch (error) {
        showError(error);
        setStatus("Error al ejecutar la escena.");
      } finally {
        running = false;
        runButton.disabled = false;
        stopButton.disabled = true;
      }
    }

    async function transformOnly() {
      if (!pyodide) return;
      clearError();
      try {
        const transformed = await transformSource(editor.getValue());
        webCode.textContent = transformed;
        setStatus("Código transformado.");
      } catch (error) {
        showError(error);
        setStatus("No se pudo transformar el código.");
      }
    }

    async function stopScene() {
      if (!pyodide || !running) return;
      try {
        await pyodide.runPythonAsync(
          "scene = globals().get('_editor_scene')\n" +
          "scene.should_end_playing = True if scene is not None else False"
        );
      } catch (_) {}
    }

    document.getElementById("assets-toggle").addEventListener("click", () => {
      assetsPanel.classList.toggle("open");
      if (assetsPanel.classList.contains("open")) refreshAssets();
    });
    document.getElementById("asset-close").addEventListener("click", () => {
      assetsPanel.classList.remove("open");
    });
    document.getElementById("asset-refresh").addEventListener("click", refreshAssets);
    document.getElementById("asset-upload").addEventListener("click", () => assetInput.click());
    assetInput.addEventListener("change", async () => {
      try {
        await importAssets(assetInput.files);
      } catch (error) {
        showError(error);
        setStatus("No se pudieron importar los assets.");
      } finally {
        assetInput.value = "";
      }
    });

    let dragDepth = 0;

    assetsDropZone.addEventListener("dragenter", event => {
      event.preventDefault();
      dragDepth++;
      assetsPanel.classList.add("drop-active");
    });

    assetsDropZone.addEventListener("dragover", event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
    });

    assetsDropZone.addEventListener("dragleave", event => {
      event.preventDefault();
      dragDepth--;
      if (dragDepth <= 0) {
        dragDepth = 0;
        assetsPanel.classList.remove("drop-active");
      }
    });

    assetsDropZone.addEventListener("drop", async event => {
      event.preventDefault();
      dragDepth = 0;
      assetsPanel.classList.remove("drop-active");
      try {
        await importAssets(event.dataTransfer.files);
      } catch (error) {
        showError(error);
        setStatus("No se pudieron importar los assets.");
      }
    });

    window.addEventListener("dragover", event => {
      if (assetsPanel.classList.contains("open")) event.preventDefault();
    });

    window.addEventListener("drop", event => {
      if (assetsPanel.classList.contains("open")) event.preventDefault();
    });

    window.addEventListener("paste", async event => {
      if (!assetsPanel.classList.contains("open")) return;
      try {
        const imported = await importClipboardData(event.clipboardData);
        if (imported) event.preventDefault();
      } catch (error) {
        showError(error);
        setStatus("No se pudo importar el contenido del portapapeles.");
      }
    });

    runButton.addEventListener("click", runScene);
    stopButton.addEventListener("click", stopScene);
    document.getElementById("format").addEventListener("click", transformOnly);

    async function initialize() {
      try {
        setLoading(true, "Cargando Monaco…");
        await loadMonaco();
        editor = monaco.editor.create(document.getElementById("editor"), {
          value: getSavedSource(),
          language: "python",
          theme: "vs-dark",
          automaticLayout: true,
          fontSize: 14,
          fontFamily: "JetBrains Mono, monospace",
          tabSize: 4,
          insertSpaces: true,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          wordWrap: "off",
          bracketPairColorization: { enabled: true },
        });

        let saveCodeTimeout = null;
        editor.onDidChangeModelContent(() => {
          if (saveCodeTimeout !== null) clearTimeout(saveCodeTimeout);
          saveCodeTimeout = setTimeout(() => {
            saveSource(editor.getValue());
            saveCodeTimeout = null;
          }, 250);
        });
        window.addEventListener("pagehide", () => saveSource(editor.getValue()));
        window.addEventListener("beforeunload", () => saveSource(editor.getValue()));

        setLoading(true, "Cargando backends WASM…");
        await initializeBrowserWasm();

        const pango = await import("./browser_wasm/dist/pango_text_loader.js");
        await pango.initializePangoText();

        setStatus("Cargando las fuentes básicas…");

        async function registerCatalogFont(fileName, url) {
          const response = await fetch(url, { cache: "force-cache" });
          if (!response.ok) {
            throw new Error("HTTP " + response.status + " al cargar " + fileName);
          }

          const bytes = await response.arrayBuffer();
          if (bytes.byteLength < 4) throw new Error("Archivo de fuente vacío o incompleto");
          const signature = new Uint8Array(bytes, 0, 4);
          const signatureText = Array.from(signature, byte =>
            byte.toString(16).padStart(2, "0")
          ).join("");
          const extension = fileName.toLowerCase().split(".").pop();
          if (extension === "ttf" &&
              !(signatureText.startsWith("00010000") ||
                signatureText.startsWith("4f54544f") ||
                signatureText.startsWith("74727565") ||
                signatureText.startsWith("74797031") ||
                signatureText.startsWith("74746366"))) {
            throw new Error("El archivo .ttf no tiene una firma TrueType válida (firma: " + signatureText + ")");
          }

          const result = { name: fileName, pango: null, typst: false, errors: [] };
          try {
            result.pango = await window.manimRegisterPangoFont(bytes.slice(0), fileName);
          } catch (error) {
            result.errors.push("Pango: " + String(error?.message || error));
          }
          try {
            const compiler = window.manimTypstCompiler;
            if (!compiler || typeof compiler.addFonts !== "function") {
              throw new Error("El compilador Typst del navegador no expone addFonts()");
            }
            await compiler.addFonts(...[new Uint8Array(bytes.slice(0))]);
            result.typst = true;
          } catch (error) {
            result.errors.push("Typst: " + String(error?.message || error));
          }
          if (!result.pango && !result.typst) {
            throw new Error(result.errors.join(" | ") || "Ningún motor aceptó la fuente");
          }
          return result;
        }

        const fontManifestUrl = new URL("./fonts/fonts.json", document.baseURI);
        const fontManifestResponse = await fetch(fontManifestUrl, { cache: "force-cache" });
        if (!fontManifestResponse.ok) {
          throw new Error("No se pudo cargar fonts/fonts.json: HTTP " + fontManifestResponse.status);
        }
        const fontManifest = await fontManifestResponse.json();
        if (!Array.isArray(fontManifest)) {
          throw new Error("fonts/fonts.json debe contener un array de fuentes.");
        }
        const availableFonts = fontManifest.filter(font =>
          font && typeof font.name === "string" && typeof font.url === "string"
        );
        if (!availableFonts.length) {
          throw new Error("fonts/fonts.json no contiene fuentes disponibles.");
        }

        const basicFontNames = new Set([
          "NewCM10-Regular.otf",
          "NewCM10-Bold.otf",
          "NewCM10-Italic.otf",
          "NewCM10-BoldItalic.otf",
          "NewCMMath-Regular.otf",
          "NewCMMono10-Regular.otf",
          "JetBrainsMono-Regular.ttf",
          "Inter[opsz,wght].ttf",
        ]);
        const loadedFontNames = new Set();
        const selectedFontNames = new Set();
        const loadingFontNames = new Set();
        const failedFontNames = new Map();
        const fontStats = { pango: 0, typst: 0, success: 0 };
        const fontsPanel = document.getElementById("fonts-panel");
        const fontsList = document.getElementById("fonts-list");
        const fontsSummary = document.getElementById("fonts-summary");
        const fontsSearch = document.getElementById("fonts-search");
        const fontsToggle = document.getElementById("fonts-toggle");
        const fontsLoadSelected = document.getElementById("fonts-load-selected");
        const fontsLoadAll = document.getElementById("fonts-load-all");

        function updateFontsSummary(message) {
          fontsSummary.textContent = message || (
            loadedFontNames.size + " de " + availableFonts.length +
            " fuentes cargadas · Pango " + fontStats.pango + " · Typst " + fontStats.typst
          );
        }

        function renderFontCatalog() {
          const query = fontsSearch.value.trim().toLocaleLowerCase();
          const fragment = document.createDocumentFragment();
          const filtered = availableFonts.filter(font =>
            (font.name + " " + (font.fileName || "")).toLocaleLowerCase().includes(query)
          );
          for (const font of filtered) {
            const fileName = font.fileName || font.name;
            const row = document.createElement("label");
            row.className = "catalog-font";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = fileName;
            checkbox.disabled = loadedFontNames.has(fileName) || loadingFontNames.has(fileName);
            checkbox.checked = loadedFontNames.has(fileName) || selectedFontNames.has(fileName);
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) selectedFontNames.add(fileName);
              else selectedFontNames.delete(fileName);
            });
            const name = document.createElement("span");
            name.textContent = font.name;
            const state = document.createElement("small");
            state.textContent = loadedFontNames.has(fileName)
              ? "Cargada"
              : loadingFontNames.has(fileName)
                ? "Cargando…"
                : failedFontNames.has(fileName) ? "Error" : "";
            row.append(checkbox, name, state);
            fragment.appendChild(row);
          }
          fontsList.replaceChildren(fragment);
          if (!filtered.length) {
            const empty = document.createElement("div");
            empty.className = "asset-empty";
            empty.textContent = "No hay fuentes que coincidan con la búsqueda.";
            fontsList.appendChild(empty);
          }
          updateFontsSummary();
        }

        async function loadCatalogFont(font) {
          const fileName = font.fileName || font.name;
          if (loadedFontNames.has(fileName) || loadingFontNames.has(fileName)) return;
          loadingFontNames.add(fileName);
          failedFontNames.delete(fileName);
          renderFontCatalog();
          updateFontsSummary("Cargando " + fileName + "…");
          try {
            const url = new URL(font.url, fontManifestUrl).href;
            const result = await registerCatalogFont(fileName, url);
            if (result.pango) {
              fontStats.pango++;
              window.manimBrowserFontFamily = String(result.pango.family);
            }
            if (result.typst) fontStats.typst++;
            loadedFontNames.add(fileName);
            selectedFontNames.delete(fileName);
            fontStats.success++;
            if (result.errors.length) {
              failedFontNames.set(fileName, result.errors.join(" | "));
              console.warn("[font catalog] Registro parcial:", fileName, result.errors);
            }
          } catch (error) {
            failedFontNames.set(fileName, String(error?.message || error));
            console.warn("[font catalog]", fileName, error);
          } finally {
            loadingFontNames.delete(fileName);
            renderFontCatalog();
          }
        }

        async function loadFontBatch(fonts) {
          const pending = fonts.filter(font => {
            const fileName = font.fileName || font.name;
            return !loadedFontNames.has(fileName) && !loadingFontNames.has(fileName);
          });
          if (!pending.length) {
            updateFontsSummary("Las fuentes seleccionadas ya están cargadas.");
            return;
          }
          fontsLoadSelected.disabled = true;
          fontsLoadAll.disabled = true;
          let done = 0;
          try {
            for (const font of pending) {
              await loadCatalogFont(font);
              done++;
              updateFontsSummary("Cargando fuentes adicionales: " + done + "/" + pending.length);
            }
          } finally {
            fontsLoadSelected.disabled = false;
            fontsLoadAll.disabled = false;
            renderFontCatalog();
            updateFontsSummary();
          }
        }

        fontsToggle.addEventListener("click", () => {
          fontsPanel.classList.toggle("open");
          assetsPanel.classList.remove("open");
          if (fontsPanel.classList.contains("open")) fontsSearch.focus();
        });
        document.getElementById("fonts-close").addEventListener("click", () =>
          fontsPanel.classList.remove("open")
        );
        fontsSearch.addEventListener("input", renderFontCatalog);
        fontsLoadSelected.addEventListener("click", () => {
          const selectedNames = new Set(
            Array.from(fontsList.querySelectorAll('input[type="checkbox"]:checked'))
              .map(input => input.value)
              .filter(name => !loadedFontNames.has(name))
          );
          loadFontBatch(availableFonts.filter(font =>
            selectedNames.has(font.fileName || font.name)
          ));
        });
        fontsLoadAll.addEventListener("click", () => loadFontBatch(availableFonts));
        renderFontCatalog();

        // Cargar solo un conjunto pequeño de fuentes habituales. El resto del catálogo
        // permanece disponible en "Fuentes" y se descarga únicamente cuando se solicita.
        const basicFonts = availableFonts.filter(font =>
          basicFontNames.has(font.fileName || font.name) ||
          basicFontNames.has(font.name)
        );
        for (const font of basicFonts) await loadCatalogFont(font);
        if (!loadedFontNames.size) {
          throw new Error("No se pudo registrar ninguna de las fuentes básicas.");
        }
        updateFontsSummary();
        console.info("Catálogo de fuentes:", {
          disponibles: availableFonts.length,
          cargadasInicialmente: loadedFontNames.size,
          cargadasEnPango: fontStats.pango,
          cargadasEnTypst: fontStats.typst,
          fallidas: Array.from(failedFontNames.entries()),
        });
        setStatus("Fuentes básicas listas (" + loadedFontNames.size + "/" + availableFonts.length +
          "). Las demás se cargan desde «Fuentes».");
        
        setLoading(true, "Cargando Pyodide…");
        const { loadPyodide } = await import(PYODIDE_URL);
        pyodide = await loadPyodide();

        setStatus("Instalando dependencias Python…");
        await pyodide.loadPackage([
          "micropip", "numpy", "scipy", "pillow", "sympy",
          "matplotlib", "pygments", "pyyaml", "tqdm", "fonttools",
        ]);

        const manifestUrl = new URL(WHEEL_MANIFEST, document.baseURI);
        const manifest = await fetch(manifestUrl, { cache: "no-store" }).then(r => {
          if (!r.ok) throw new Error("No se pudo cargar wheels.json: " + r.status);
          return r.json();
        });
        const wheelBase = new URL(".", manifestUrl).href;

        await pyodide.runPythonAsync(`
import micropip
await micropip.install(${JSON.stringify(new URL(manifest.wgpu, wheelBase).href)})
await micropip.install(${JSON.stringify(new URL(manifest.manimgl, wheelBase).href)})
`);

        setLoading(true, "Restaurando assets guardados…");
        ensureAssetDir();
        try {
          const savedAssets = await loadPersistedAssets();
          for (const savedAsset of savedAssets) {
            if (!savedAsset || typeof savedAsset.name !== "string" || !savedAsset.bytes) continue;
            const path = ASSET_DIR + "/" + savedAsset.name;
            const bytes = new Uint8Array(savedAsset.bytes);
            pyodide.FS.writeFile(path, bytes);
            const extension = savedAsset.name.toLowerCase().split(".").pop();
            if (["ttf", "otf", "woff", "woff2"].includes(extension)) {
              try {
                const metadata = await readFontMetadata(path);
                await registerFontAsset(path);
                assetFontMetadata.set(path, metadata);
              } catch (error) {
                console.warn("[asset persistence] No se pudo restaurar la fuente:", savedAsset.name, error);
              }
            }
          }
        } catch (error) {
          console.warn("[asset persistence] No se pudieron restaurar los assets:", error);
          setStatus("No se pudieron restaurar los assets guardados; puedes importarlos de nuevo.");
        }
        setLoading(false);
        runButton.disabled = false;
        refreshAssets();
        setStatus("Listo. Código y assets se guardan automáticamente en este navegador.");
        await transformOnly();
      } catch (error) {
        showError(error);
        setLoading(false);
        setStatus("Error de inicialización.");
      }
    }

    initialize();
  </script>
</body>
</html>
